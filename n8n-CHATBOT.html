<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چت هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"></script>
<style>
:root{
  --bg:#f4f5fb; --surface:#fff; --text:#1c1e2b; --muted:#7a7f95; --border:#e4e6f0;
  --accent:#5b5bf0; --accent2:#8b5cf6; --user-bg:linear-gradient(135deg,var(--accent),var(--accent2)); --user-text:#fff;
  --bot-bg:#fff; --code-bg:#12131c; --code-text:#e6e8f5; --shadow:0 8px 30px rgba(40,40,90,.08);
}
:root[data-theme="dark"]{
  --bg:#0f1017; --surface:#171925; --text:#e8eaf5; --muted:#8c91a8; --border:#272a3b;
  --bot-bg:#1d2030; --code-bg:#0a0b11; --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;font-size:15px}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);padding-top:calc(14px + env(safe-area-inset-top,0px))}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--user-bg);display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.title{flex:1}
.title b{display:block;font-size:16px}
.title small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.dot.busy{background:#f59e0b;animation:pulse 1s infinite}
.icon-btn{border:1px solid var(--border);background:transparent;color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px;transition:.2s}
.icon-btn:hover{background:var(--bg)}
#messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:88%;animation:in .25s ease}
.msg.user{align-self:flex-start}
.msg.bot{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:10px 14px;border-radius:16px;line-height:1.85;word-break:break-word;position:relative}
.user .bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:4px}
.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble p+p,.bubble ul+p,.bubble p+ul,.bubble pre+p,.bubble p+pre{margin-top:8px}
.bubble ul{padding-inline-start:22px}
.bubble h3,.bubble h4{margin:6px 0 2px}
.bubble a{color:inherit;text-decoration:underline}
.bot .bubble a{color:var(--accent)}
.bubble code{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;background:rgba(127,127,160,.18);padding:1px 6px;border-radius:5px;font-size:.88em}
.bubble pre{background:var(--code-bg);color:var(--code-text);padding:12px;border-radius:10px;overflow-x:auto;direction:ltr;text-align:left;margin-top:8px}
.bubble pre code{background:none;padding:0;color:inherit}
.copy{position:absolute;bottom:-9px;inset-inline-end:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:11px;padding:1px 8px;border-radius:20px;cursor:pointer;opacity:0;transition:.2s}
.bot .bubble:hover .copy{opacity:1}
.typing{display:flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.welcome{margin:auto;text-align:center;color:var(--muted);padding:20px}
.welcome .avatar{width:64px;height:64px;font-size:30px;margin:0 auto 14px}
.welcome h2{color:var(--text);font-size:19px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.banner{background:#fef3c7;color:#92400e;padding:8px 16px;font-size:13px;text-align:center}
.error .bubble{border-color:#ef4444;color:#ef4444}
form{display:flex;align-items:flex-end;gap:10px;padding:12px 16px;border-top:1px solid var(--border);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;padding:11px 14px;border-radius:14px;max-height:160px;outline:none;line-height:1.6;transition:.2s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,240,.15)}
#send{width:46px;height:46px;border:0;border-radius:14px;background:var(--user-bg);color:#fff;cursor:pointer;font-size:19px;flex:none;transition:.2s}
#send:disabled{opacity:.45;cursor:not-allowed}
#send svg{transform:scaleX(-1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:600px){.app{box-shadow:none}.msg{max-width:94%}}


/* فاصله‌گذاری و تیترهای پاسخ */
.bot .bubble {
  line-height: 1.9;
  overflow-wrap: anywhere;
  min-width: 0;
}

.bot .bubble h1,
.bot .bubble h2,
.bot .bubble h3,
.bot .bubble h4 {
  color: var(--accent);
  line-height: 1.6;
  margin: 16px 0 8px;
}

.bot .bubble h1 { font-size: 1.3rem; }
.bot .bubble h2 { font-size: 1.18rem; }
.bot .bubble h3 { font-size: 1.08rem; }
.bot .bubble h4 { font-size: 1rem; }

.bot .bubble p {
  margin: 7px 0;
}

/* جدول‌ها */
.bot .bubble .table-wrap {
  max-width: 100%;
  overflow-x: auto;
  margin: 14px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  -webkit-overflow-scrolling: touch;
}

.bot .bubble table {
  width: 100%;
  min-width: 340px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  line-height: 1.8;
}

.bot .bubble th {
  background: #5b5bf0;
  color: white;
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
  padding: 11px 14px;
}

.bot .bubble td {
  padding: 10px 14px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.bot .bubble tbody tr:nth-child(even) {
  background: var(--bg);
}

.bot .bubble tbody tr:last-child td {
  border-bottom: 0;
}

.bot .bubble tbody tr:hover {
  background: rgba(91, 91, 240, .07);
}

/* بولت‌های رنگی */
.bot .bubble ul,
.bot .bubble ol {
  padding-inline-start: 25px;
  margin: 9px 0;
}

.bot .bubble ul {
  list-style-type: disc;
}

.bot .bubble li {
  padding-inline-start: 3px;
  margin: 5px 0;
}

.bot .bubble li::marker {
  color: var(--accent);
  font-weight: 700;
}

.bot .bubble li::selection {
  background: rgba(91, 91, 240, .2);
}

/* نقل‌قول */
.bot .bubble blockquote {
  margin: 12px 0;
  padding: 10px 14px;
  border-inline-start: 4px solid var(--accent);
  background: var(--bg);
  border-radius: 8px;
  color: var(--muted);
}

/* جداکننده */
.bot .bubble hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

/* لینک */
.bot .bubble a {
  color: var(--accent);
  text-decoration: none;
  overflow-wrap: anywhere;
}

.bot .bubble a:hover {
  text-decoration: underline;
}

/* کد داخل متن */
.bot .bubble :not(pre) > code {
  color: var(--accent);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 6px;
  direction: ltr;
  unicode-bidi: isolate;
}

/* بلوک کد */
.bot .bubble pre {
  max-width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  margin: 12px 0;
  border-radius: 10px;
}

.bot .bubble pre code {
  white-space: pre;
}

/* نمایش موبایل */
@media (max-width: 600px) {
  .bot .bubble {
    padding: 10px 12px;
  }

  .bot .bubble table {
    font-size: 12px;
  }

  .bot .bubble th,
  .bot .bubble td {
    padding: 8px 10px;
  }
}



</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">✦</div>
    <div class="title"><b>دستیار هوشمند</b><small><span class="dot" id="dot"></span><span id="status">آنلاین</span></small></div>
    <button class="icon-btn" id="theme" title="تغییر تم">🌓</button>
    <button class="icon-btn" id="reset" title="گفتگوی جدید">＋</button>
  </header>
  <div class="banner" id="banner" hidden>آدرس وبهوک n8n را در بخش CONFIG داخل کد وارد کنید.</div>
  <div id="messages"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="پیام خود را بنویسید..." autocomplete="off"></textarea>
    <button id="send" type="submit" title="ارسال"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
  </form>
</div>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  // آدرس Production URL نود Chat Trigger (Hosted Chat باید Public باشد)
  webhookUrl: "",
  username: "",
  password: "",
  suggestions: ["وضعیت آب و هوای تهران"],
  headers: {}            // در صورت نیاز: { "Authorization": "Bearer ..." }
};
/* ================================== */

const $ = id => document.getElementById(id);
const box = $("messages"), input = $("input"), sendBtn = $("send");
let busy = false;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
let sessionId = store.get("n8n_chat_session") || newId();
store.set("n8n_chat_session", sessionId);

/* theme */
const root = document.documentElement;
const savedTheme = store.get("n8n_chat_theme");
if (savedTheme) root.dataset.theme = savedTheme;
else if (matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme = "dark";
$("theme").onclick = () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  store.set("n8n_chat_theme", root.dataset.theme);
};

if (CONFIG.webhookUrl.includes("YOUR-N8N-DOMAIN")) $("banner").hidden = false;


/* ============ Markdown Renderer ============ */

marked.setOptions({
  gfm: true,
  breaks: true
});

function md(text) {
  const source = String(text ?? "");

  // تبدیل Markdown به HTML و پاک‌سازی HTML نهایی
  const rawHtml = marked.parse(source);

  const safeHtml = DOMPurify.sanitize(rawHtml, {
    USE_PROFILES: { html: true },
    ADD_ATTR: ["target", "rel"]
  });

  // قرار دادن جدول‌ها داخل ظرف اسکرول افقی
  const template = document.createElement("template");
  template.innerHTML = safeHtml;

  template.content.querySelectorAll("table").forEach(table => {
    const wrapper = document.createElement("div");
    wrapper.className = "table-wrap";
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  // لینک‌ها در تب جدید و با تنظیمات امن باز شوند
  template.content.querySelectorAll("a").forEach(link => {
    const href = link.getAttribute("href") || "";

    if (/^https?:\/\//i.test(href)) {
      link.setAttribute("target", "_blank");
      link.setAttribute("rel", "noopener noreferrer");
    } else {
      link.removeAttribute("href");
      link.removeAttribute("target");
    }
  });

  return template.innerHTML;
}

/* =========================================== */




/* UI */
function scrollDown(){ box.scrollTop = box.scrollHeight }
function addMsg(role, text, cls){
  const w = box.querySelector(".welcome"); if (w) w.remove();
  const el = document.createElement("div");
  el.className = "msg " + role + (cls ? " " + cls : "");
  const b = document.createElement("div");
  b.className = "bubble"; b.dir = "auto";
  if (role === "user") b.textContent = text; else b.innerHTML = md(text);
  el.appendChild(b); box.appendChild(el); scrollDown();
  return b;
}
function addCopy(b, getText){
  const c = document.createElement("button");
  c.className = "copy"; c.type = "button"; c.textContent = "کپی";
  c.onclick = () => { navigator.clipboard?.writeText(getText()); c.textContent = "کپی شد ✓"; setTimeout(()=>c.textContent="کپی",1500) };
  b.appendChild(c);
}
function setBusy(v){
  busy = v; sendBtn.disabled = v;
  $("dot").classList.toggle("busy", v);
  $("status").textContent = v ? "در حال نوشتن..." : "آنلاین";
}
function welcome(){
  box.innerHTML = '<div class="welcome"><div class="avatar">✦</div><h2>سلام! چطور میتونم کمکت کنم؟</h2><p>هر سوالی داری بپرس.</p><div class="chips"></div></div>';
  const chips = box.querySelector(".chips");
  CONFIG.suggestions.forEach(s=>{
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = s;
    c.onclick = () => send(s);
    chips.appendChild(c);
  });
}

/* ارتباط با n8n */
function extract(raw){
  // پاسخ غیراستریم: {output:"..."} یا آرایهای از آن
  try{
    let j = JSON.parse(raw);
    if (Array.isArray(j)) j = j[0];
    return j?.output ?? j?.text ?? j?.message ?? j?.response ?? "";
  }catch(e){ return "" }
}

async function send(text){
  text = (text ?? input.value).trim();
  if (!text || busy) return;
  input.value = ""; autosize();
  addMsg("user", text);
  setBusy(true);

  const bubble = addMsg("bot", "");
  bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  let full = "";

  try{
    const auth = btoa(`${CONFIG.username}:${CONFIG.password}`);
    const res = await fetch(CONFIG.webhookUrl, {
      method: "POST",
      headers: {"Authorization": `Basic ${auth}`,"Content-Type": "application/json", ...CONFIG.headers },
      body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: text })
    });
    if (!res.ok) throw new Error("خطای سرور (" + res.status + ")");

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let raw = "", buf = "";
    const handle = line => {
      line = line.trim(); if (!line) return;
      try{
        const j = JSON.parse(line);
        if (j.type === "item" && typeof j.content === "string") full += j.content;
        else if (j.type === "error") throw new Error(j.content || "خطا");
        else if (!j.type && (j.output || j.text)) full = j.output || j.text;
      }catch(e){ if (e.message && !(e instanceof SyntaxError)) throw e }
    };
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      const chunk = dec.decode(value, {stream:true});
      raw += chunk; buf += chunk;
      const lines = buf.split("\n"); buf = lines.pop();
      lines.forEach(handle);
      if (full){ bubble.innerHTML = md(full); scrollDown(); }
    }
    handle(buf);
    if (!full) full = extract(raw) || raw.trim();   // fallback برای JSON چندخطی
    if (!full) full = "پاسخی دریافت نشد.";
    bubble.innerHTML = md(full);
    addCopy(bubble, () => full);
  }catch(err){
    bubble.parentElement.classList.add("error");
    bubble.textContent = "⚠️ " + (err.message === "Failed to fetch"
      ? "اتصال به n8n برقرار نشد. آدرس وبهوک و تنظیم CORS را بررسی کنید."
      : err.message);
  }finally{
    setBusy(false); scrollDown(); input.focus();
  }
}

/* رویدادها */
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight,160) + "px" }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send() }
});
$("form").addEventListener("submit", e => { e.preventDefault(); send() });
$("reset").onclick = () => {
  if (busy) return;
  sessionId = newId(); store.set("n8n_chat_session", sessionId);
  welcome(); input.focus();
};

welcome();
</script>
</body>
</html>
